<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Feed · jornkirkels</title>
<style>
  html, body { margin: 0; height: 100% }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; color: #666; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif }
  a { color: #0a66ff }
</style>
</head>
<body>
<p id="m">Loading...</p>
<script>
// Feed share link (Demi, 2-11): forwards to the online copy of Feed on Cloudflare (https://feed-share.demi-87b.workers.dev), which Feed keeps up to date
// and which also stores Jorn's feedback, so it works with Demi's Mac off.
// The code comes after the # once per device and is kept in this browser; it never reaches GitHub or this site.
const KEEP = 'feed.key.jornkirkels'
if (/^#[\w-]{16,}$/.test(location.hash)) { localStorage.setItem(KEEP, location.hash.slice(1)); history.replaceState(null, '', location.pathname) }
const key = localStorage.getItem(KEEP) || ''
const say = (html) => { document.getElementById('m').innerHTML = html }
if (!/^[\w-]{16,}$/.test(key)) say('Ask Demi for the link with the code.')
else location.replace('https://feed-share.demi-87b.workers.dev/' + key + '/')
</script>
</body>
</html>
