<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Feed</title>
<style>
  html, body { margin: 0; height: 100% }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; color: #666; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif }
  a { color: #0a66ff }
</style>
</head>
<body>
<p id="m">Loading...</p>
<script>
// Feed share link (Demi, 2-11): Feed runs on Demi's Mac behind a tunnel whose address changes; ~/Code/feed/scripts/
// share-tunnel.py writes the current one below. The secret comes after the # in the link, so it never reaches this site.
const host = 'creating-instruction-handmade-styles.trycloudflare.com'
const key = location.hash.slice(1)
const say = (html) => { document.getElementById('m').innerHTML = html }
if (!/^[\w-]{16,}$/.test(key)) say('This link is incomplete.')
else fetch('https://' + host + '/robots.txt', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(); location.replace('https://' + host + '/' + key + '/') })
  .catch(() => say('Feed isn\'t open right now. <a href="" onclick="location.reload(); return false">Try again</a> in a while.'))
</script>
</body>
</html>
